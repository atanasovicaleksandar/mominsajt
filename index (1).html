<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Response Generator</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#121a2b; --line:#293449; --text:#f3f6fc; --muted:#9aa8bd; --accent:#a3e635; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 16px; background:radial-gradient(ellipse at top, #17223b 0%, var(--bg) 58%); color:var(--text); font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%, 720px); }
    .eyebrow { color:var(--accent); font-size:.76rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:.55rem 0 .4rem; font-size:clamp(2.2rem,7vw,4rem); line-height:1.05; letter-spacing:-.055em; }
    .intro { margin:0 0 26px; color:var(--muted); }
    .panel { border:1px solid var(--line); border-radius:22px; padding:clamp(18px,4vw,30px); background:rgba(18,26,43,.88); box-shadow:0 24px 80px #0004; }
    .topline { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; color:var(--muted); font-size:.86rem; }
    .dot { display:inline-block; width:8px; height:8px; margin-right:7px; border-radius:50%; background:var(--accent); }
    button { width:100%; padding:15px 18px; border:0; border-radius:12px; background:var(--accent); color:#17210a; font:750 1rem system-ui,sans-serif; cursor:pointer; transition:transform .15s, filter .15s; }
    button:hover { filter:brightness(1.06); transform:translateY(-1px); }
    button:focus-visible { outline:3px solid white; outline-offset:3px; }
    button:disabled { opacity:.7; cursor:wait; }
    .responses { display:grid; gap:12px; margin-top:20px; }
    .response { display:flex; align-items:flex-start; gap:14px; padding:15px; border:1px solid var(--line); border-radius:13px; background:#0d1423; animation:appear .25s ease both; }
    .number { display:grid; place-items:center; flex:0 0 28px; height:28px; border-radius:8px; background:#263347; color:var(--accent); font-size:.8rem; font-weight:800; }
    .response p { margin:2px 0 0; }
    .placeholder { color:var(--muted); text-align:center; padding:30px 12px; border:1px dashed var(--line); border-radius:13px; }
    footer { margin-top:18px; text-align:center; color:#718098; font-size:.8rem; }
    @keyframes appear { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A tiny internet tool</div>
    <h1>Response Generator<span style="color:var(--accent)">.</span></h1>
    <p class="intro">One click. Five replies. Pick the one that fits.</p>
    <section class="panel" aria-labelledby="section-title">
      <div class="topline"><span id="section-title"><span class="dot"></span>READY WHEN YOU ARE</span><span id="count">0 generations</span></div>
      <button id="generate" type="button">Generate response</button>
      <div id="responses" class="responses" aria-live="polite">
        <div class="placeholder">Your five responses will show up here.</div>
      </div>
    </section>
    <footer>Small tool. No account. No drama.</footer>
  </main>
  <script>
    const replies = [
      "Sounds good to me — let's do it.",
      "Thanks for sharing. I'll take a look and get back to you.",
      "That works! Appreciate you making this happen.",
      "Got it. Let me think it through and I'll follow up soon.",
      "Absolutely — thanks for the update!"
    ];
    const button = document.querySelector("#generate");
    const output = document.querySelector("#responses");
    const count = document.querySelector("#count");
    let generations = 0;

    button.addEventListener("click", () => {
      generations++;
      count.textContent = `${generations} generation${generations === 1 ? "" : "s"}`;
      const shuffled = [...replies].sort(() => Math.random() - 0.5);
      output.replaceChildren();
      shuffled.forEach((reply, index) => {
        const card = document.createElement("article");
        card.className = "response";
        card.style.animationDelay = `${index * 45}ms`;
        const number = document.createElement("span");
        number.className = "number";
        number.textContent = String(index + 1).padStart(2, "0");
        const text = document.createElement("p");
        text.textContent = reply;
        card.append(number, text);
        output.append(card);
      });
    });
  </script>
</body>
</html>
